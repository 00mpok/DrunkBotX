---
services:
  drunkbot:
    build: .
    container_name: drunkbot
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./config/config.json:/app/config.json:ro
      - ./storage:/app/storage
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - BOT_TOKEN=${BOT_TOKEN}
      - OPENAI_TOKEN=${OPENAI_TOKEN}
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 50

networks:
  default:
    external: true
    name: apps_net